<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EADEC9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的班表">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- 載入可愛質感數字字體 Quicksand -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<title>我的班表</title>
<style>
:root{
  --deep:#6C5245;       /* 深濃焙焦糖棕 */
  --main:#8C705F;       /* 奶茶主色 */
  --soft:#F3EBE1;       /* 淺奶泡色 */
  --paper:#FAF7F2;      /* 燕麥奶油白 */
  --ink:#423229;        /* 深咖啡黑字 */
  --muted:#A08B7D;      /* 燕麥奶灰棕 */
  --line:#E2D5C5;       /* 奶茶邊框色 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:linear-gradient(145deg,#EADEC9,#FAF7F2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
.app{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 10px calc(240px + env(safe-area-inset-bottom))}
h1{font:500 28px 'Quicksand',Georgia,"Noto Serif TC",serif;color:var(--deep);margin:4px 0 16px}.sub{font-size:11px;letter-spacing:.18em;color:var(--main)}
.bar{display:flex;align-items:center;justify-content:space-between;background:#FAF7F2f2;border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 8px 25px #6c524514}
.bar button{border:0;background:var(--soft);color:var(--deep);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}.title{text-align:center}.title b{font:500 23px 'Quicksand',Georgia,"Noto Serif TC",serif}.title small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* 日曆表格 */
.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week{margin:14px 0 7px;color:var(--muted);font-size:11px;text-align:center}
.cal .day{
  min-height:96px;
  background:#FAF7F2;
  border:1px solid var(--line);
  border-radius:10px;
  padding:5px 4px;
  cursor:pointer;
  position:relative;
  transition:all .15s ease;
  touch-action:none;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  color:var(--ink)!important;
}
.empty{background:transparent!important;border:0!important;pointer-events:none}
.day.selected{outline:3px solid var(--deep);box-shadow:0 2px 8px #6c524540;z-index:2}

/* 頂部單行區域 (數字靠左，農曆/節氣靠右) */
.day-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  width:100%;
  margin-bottom:4px;
}

/* 替換為 Quicksand 圓潤數字字體 */
.num{
  font-family:'Quicksand', -apple-system, sans-serif;
  font-size:16px;
  color:var(--ink)!important;
  font-weight:700;
  line-height:1;
}
.day.is-holiday .num{color:#b94a3e!important}

.lunar-info{
  font-size:10px;
  color:var(--ink);
  opacity:0.75;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.lunar-info.highlight{
  color:#b94a3e;
  font-weight:700;
  opacity:1;
}

/* 整格填滿顏色 (奶茶色系調校) */
.c-mist{background:#D1E0E0!important}      /* 薄荷奶綠 - MIST */
.c-cashmere{background:#E8CCA4!important}  /* 泰式奶茶 - CASHMERE */
.c-olive{background:#C0C999!important}     /* 抹茶拿鐵 - OLIVE */
.c-straw{background:#ECE09B!important}     /* 伯爵鮮奶 - STRAW */

/* 休假與其他假別整格填滿 */
.off{background:#E5BDC5!important}        /* 玫瑰奶茶 */
.leave{background:#D3CBD5!important}      /* 芋香拿鐵 */
.sick{background:#F7C1B5!important}       /* 蜜桃奶茶 */
.other{background:#DCD1E8!important}      /* 薰衣草奶茶 */

/* 時間與備註文字排版 */
.entry-text{font-size:10px;line-height:1.2;font-weight:700;text-align:center;color:var(--ink)!important;margin-top:auto;margin-bottom:auto}
.note{font-size:9px;color:var(--ink)!important;opacity:0.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;max-width:100%}

/* 底部展開面板 */
.bottom-panel{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -5px 25px #6c52451f;display:none;z-index:100}
.bottom-panel.show{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--deep)}
.panel-cancel{background:transparent;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}

.type-group,.time-group{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:20px;font-size:12px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.active{background:var(--deep);color:#fff;border-color:var(--deep)}

.note-input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;background:#F3EBE1;margin-bottom:10px;color:var(--ink)}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1;padding:10px;border:0;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}
.btn-save{background:var(--deep);color:#fff}
.btn-clear{background:#EADEC9;color:var(--deep)}

@media(min-width:650px){.app{padding:30px 16px 240px}.cal{gap:8px}.week{gap:8px}.cal .day{min-height:110px;padding:8px}.entry-text{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<div class="sub">MY SHIFT JOURNAL</div><h1>我的班表</h1>
<div class="bar"><button id="prev">‹</button><div class="title"><b id="mt"></b><small>可單點多選或長按滑動選取日期</small></div><button id="next">›</button></div>
<div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
<div class="cal" id="cal"></div>
</div>

<div class="bottom-panel" id="panel">
  <div class="panel-head">
    <span id="batchCount">已選擇 0 天</span>
    <button class="panel-cancel" id="cancelBatch">取消選擇</button>
  </div>
  
  <div class="type-group" id="typeGroup">
    <div class="chip active" data-type="work">上班</div>
    <div class="chip" data-type="off">休假</div>
    <div class="chip" data-type="leave">特休</div>
    <div class="chip" data-type="sick">病假</div>
    <div class="chip" data-type="other">其他</div>
  </div>

  <div class="time-group" id="timeGroup">
    <div class="chip active" data-time="09:00 18:00">09:00 18:00</div>
    <div class="chip" data-time="10:00 19:00">10:00 19:00</div>
    <div class="chip" data-time="11:00 21:00">11:00 21:00</div>
    <div class="chip" data-time="12:00 21:00">12:00 21:00</div>
  </div>

  <input type="text" class="note-input" id="noteInput" placeholder="填寫備註（可不填）">

  <div class="btn-row">
    <button class="btn-clear" id="clearBtn">清除紀錄</button>
    <button class="btn-save" id="saveBtn">儲存套用</button>
  </div>
</div>

<script>
const K="shift-pwa-v1";let D=JSON.parse(localStorage.getItem(K)||"{}"),V=new Date();V.setDate(1);
let selectedSet=new Set();
let currentType="work", currentTime="09:00 18:00";

let dragStartDay = null, isDragging = false;
let startX = 0, startY = 0;

const SHIFT_COLORS = {
  "09:00 18:00": "c-mist",
  "10:00 19:00": "c-cashmere",
  "11:00 21:00": "c-olive",
  "12:00 21:00": "c-straw"
};

const $=x=>document.getElementById(x),pad=x=>String(x).padStart(2,"0"),id=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

/* --- 農曆與農曆節日（三大節）計算 --- */
function getLunarDetails(y, m, d) {
  let date = new Date(y, m, d);
  let lunarObj = { text: "", festival: "" };
  try {
    let formatter = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { day: 'numeric', month: 'numeric' });
    let parts = formatter.formatToParts(date);
    let monthNum = 0, dayNum = 0;
    for (let p of parts) {
      if (p.type === 'month') monthNum = parseInt(p.value);
      if (p.type === 'day') dayNum = parseInt(p.value);
    }
    
    let dayNames = ["","初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
    let monthNames = ["","正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","臘月"];
    lunarObj.text = (dayNum === 1) ? monthNames[monthNum] : (dayNames[dayNum] || "");

    if (monthNum === 1 && dayNum === 1) lunarObj.festival = "初一";
    else if (monthNum === 1 && dayNum === 2) lunarObj.festival = "初二";
    else if (monthNum === 1 && dayNum === 3) lunarObj.festival = "初三";
    else if (monthNum === 1 && dayNum === 15) lunarObj.festival = "元宵節";
    else if (monthNum === 5 && dayNum === 5) lunarObj.festival = "端午節";
    else if (monthNum === 7 && dayNum === 7) lunarObj.festival = "七夕";
    else if (monthNum === 7 && dayNum === 15) lunarObj.festival = "中元節";
    else if (monthNum === 8 && dayNum === 15) lunarObj.festival = "中秋節";
    else if (monthNum === 9 && dayNum === 9) lunarObj.festival = "重陽節";
    else if (monthNum === 12 && dayNum === 8) lunarObj.festival = "臘八節";
    
    let nextDate = new Date(y, m, d + 1);
    let nextParts = formatter.formatToParts(nextDate);
    let nextM = 0, nextD = 0;
    for (let p of nextParts) {
      if (p.type === 'month') nextM = parseInt(p.value);
      if (p.type === 'day') nextD = parseInt(p.value);
    }
    if (nextM === 1 && nextD === 1) {
      lunarObj.festival = "除夕";
    }

  } catch(e) {
    lunarObj.text = "";
  }
  return lunarObj;
}

/* --- 二十四節氣計算 --- */
const SOLAR_TERMS = ["小寒","大寒","立春","雨水","驚蟄","春分","清明","穀雨","立夏","小滿","芒種","夏至","小暑","大暑","立秋","處暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
function getSolarTerm(y, m, d) {
  const termInfo = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375447,397305,418910,440228,461222,481851,501988];
  let offDate1 = new Date((31556925974.7 * (y - 1900) + termInfo[m * 2] * 60000) + Date.UTC(1900, 0, 6, 2, 5));
  if (offDate1.getUTCDate() === d) return SOLAR_TERMS[m * 2];
  let offDate2 = new Date((31556925974.7 * (y - 1900) + termInfo[m * 2 + 1] * 60000) + Date.UTC(1900, 0, 6, 2, 5));
  if (offDate2.getUTCDate() === d) return SOLAR_TERMS[m * 2 + 1];
  return "";
}

/* --- 陽曆國定假日與常用節日 --- */
function getSolarHoliday(m, d) {
  let key = `${pad(m + 1)}-${pad(d)}`;
  let holidays = {
    "01-01": "元旦",
    "02-28": "和平紀念日",
    "04-04": "兒童節",
    "05-01": "勞動節",
    "08-08": "父親節",
    "09-03": "軍人節",
    "09-28": "教師節",
    "10-10": "國慶日",
    "12-25": "行憲紀念日"
  };
  return holidays[key] || "";
}

function render(){
  let y=V.getFullYear(),m=V.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  $("mt").textContent=`${y} 年 ${m+1} 月`;$("cal").innerHTML="";
  for(let i=0;i<first;i++)$("cal").appendChild(Object.assign(document.createElement("div"),{className:"day empty"}));
  
  for(let d=1;d<=last;d++){
    let dateKey=id(y,m,d);
    let e=document.createElement("div");
    let r=D[dateKey];
    let isSelected=selectedSet.has(dateKey);
    
    let lunarInfo = getLunarDetails(y, m, d);
    let term = getSolarTerm(y, m, d);
    let solarHoliday = getSolarHoliday(m, d);

    let rightText = solarHoliday || lunarInfo.festival || term || lunarInfo.text;
    let isHighlight = !!solarHoliday || !!lunarInfo.festival || !!term;

    let colorClass = "";
    if(r){
      colorClass = r.type==="work" ? (SHIFT_COLORS[r.shift] || "c-mist") : r.type;
    }

    e.className="day "+colorClass+(isSelected?" selected":"")+(isHighlight?" is-holiday":"");
    e.dataset.day = d;
    e.dataset.key = dateKey;
    
    let html = `
      <div class="day-header">
        <span class="num">${d}</span>
        <span class="lunar-info ${isHighlight ? 'highlight' : ''}">${rightText}</span>
      </div>
    `;

    if(r){
      let text=r.type==="work"?r.shift:{off:"休假",leave:"特休",sick:"病假",other:"其他"}[r.type];
      html += `<div class="entry-text">${text}</div>`+(r.note?`<div class="note">${esc(r.note)}</div>`:"");
    }
    e.innerHTML = html;
    $("cal").appendChild(e);
  }
  updatePanel();
}

function getDayFromPoint(x, y) {
  let el = document.elementFromPoint(x, y);
  if (!el) return null;
  let dayEl = el.closest(".day:not(.empty)");
  return dayEl ? parseInt(dayEl.dataset.day) : null;
}

const calGrid = $("cal");

calGrid.addEventListener("pointerdown", e => {
  let day = getDayFromPoint(e.clientX, e.clientY);
  if (!day) return;
  dragStartDay = day;
  startX = e.clientX;
  startY = e.clientY;
  isDragging = false;
});

calGrid.addEventListener("pointermove", e => {
  if (!dragStartDay) return;
  let dist = Math.hypot(e.clientX - startX, e.clientY - startY);
  if (dist > 8) isDragging = true;
  
  if (isDragging) {
    let currentDay = getDayFromPoint(e.clientX, e.clientY);
    if (currentDay) {
      let min = Math.min(dragStartDay, currentDay);
      let max = Math.max(dragStartDay, currentDay);
      let y = V.getFullYear(), m = V.getMonth();
      for (let d = min; d <= max; d++) {
        selectedSet.add(id(y, m, d));
      }
      render();
    }
  }
});

window.addEventListener("pointerup", e => {
  if (dragStartDay && !isDragging) {
    let y = V.getFullYear(), m = V.getMonth();
    let key = id(y, m, dragStartDay);
    if (selectedSet.has(key)) {
      selectedSet.delete(key);
    } else {
      selectedSet.add(key);
    }
    render();
  }
  dragStartDay = null;
  isDragging = false;
});

window.addEventListener("pointercancel", () => {
  dragStartDay = null;
  isDragging = false;
});

function updatePanel(){
  let count=selectedSet.size;
  if(count>0){
    $("batchCount").textContent=`已選擇 ${count} 天`;
    $("panel").classList.add("show");
  }else{
    $("panel").classList.remove("show");
  }
}

document.querySelectorAll("#typeGroup .chip").forEach(chip=>{
  chip.onclick=()=>{
    document.querySelectorAll("#typeGroup .chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    currentType=chip.dataset.type;
    $("timeGroup").style.display = currentType==="work"?"flex":"none";
  }
});

document.querySelectorAll("#timeGroup .chip").forEach(chip=>{
  chip.onclick=()=>{
    document.querySelectorAll("#timeGroup .chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    currentTime=chip.dataset.time;
  }
});

$("cancelBatch").onclick=()=>{selectedSet.clear();render()};

$("saveBtn").onclick=()=>{
  let noteText=$("noteInput").value.trim();
  selectedSet.forEach(k=>{
    D[k]={type:currentType,shift:currentTime,note:noteText};
  });
  localStorage.setItem(K,JSON.stringify(D));
  selectedSet.clear();
  $("noteInput").value="";
  render();
};

$("clearBtn").onclick=()=>{
  selectedSet.forEach(k=>{ delete D[k]; });
  localStorage.setItem(K,JSON.stringify(D));
  selectedSet.clear();
  $("noteInput").value="";
  render();
};

$("prev").onclick=()=>{V.setMonth(V.getMonth()-1);selectedSet.clear();render()};
$("next").onclick=()=>{V.setMonth(V.getMonth()+1);selectedSet.clear();render()};
render();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(err=>console.log("SW Register Fail:", err));
}
</script>
</body>
</html>
